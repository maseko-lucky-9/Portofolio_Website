# ==============================================
# Kustomization - Redis Cache
# Base Redis resources
# ==============================================

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# See database/kustomization.yaml: `commonLabels` poisons NetworkPolicy peer
# selectors. Use `labels` with includeSelectors:false.
labels:
  - pairs:
      app.kubernetes.io/name: redis
      app.kubernetes.io/component: cache
      app.kubernetes.io/part-of: portfolio
    includeSelectors: false
    includeTemplates: true

resources:
- deployment.yaml
- service.yaml
- configmap.yaml
# Secrets come from ExternalSecrets (Vault); secret.yaml is now
# secret.yaml.example. See database/kustomization.yaml for why.
- external-secret.yaml
- networkpolicy.yaml
