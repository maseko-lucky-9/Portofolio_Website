# ==============================================
# ArgoCD Application - Backend Production
# ==============================================

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backend-prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "30"
    notifications.argoproj.io/subscribe.on-sync-succeeded.slack: "production-deployments"
    notifications.argoproj.io/subscribe.on-sync-failed.slack: "production-alerts"
    notifications.argoproj.io/subscribe.on-health-degraded.slack: "production-alerts"
spec:
  project: default
  
  source:
    repoURL: https://github.com/maseko-lucky-9/Portofolio_Website.git
    targetRevision: main
    path: portfolio-api/k8s/overlays/prod
  
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  
  syncPolicy:
    # FROZEN — genuinely manual now. The comment below used to say "Manual sync
    # for production" while an `automated:` block sat right under it: with
    # `automated` present, ArgoCD auto-syncs on every NEW GIT REVISION, and
    # prune/selfHeal:false only suppress drift-triggered syncs. So every push to
    # `main` still re-applied the prod overlay. Retiring backend-cd.yml stopped
    # the image mirror but NOT this. Automated sync is now removed.
    syncOptions:
    - CreateNamespace=true
    - PrunePropagationPolicy=foreground
    - PruneLast=true
    - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 5m
  
  ignoreDifferences:
  - group: apps
    kind: Deployment
    jsonPointers:
    - /spec/replicas
  - group: autoscaling
    kind: HorizontalPodAutoscaler
    jsonPointers:
    # /spec/minReplicas is NOT ignored. It is a static spec field the HPA never
    # rewrites at runtime, so ignoring it only meant git could not govern the
    # replica floor — hpa-patch.yaml said one thing and the live HPA kept
    # another, with no drift ever reported. /spec/maxReplicas stays ignored.
    - /spec/maxReplicas
  # Secret ignoreDifferences removed — ESO manages prod-backend-secrets
  - kind: NetworkPolicy
    name: prod-backend-api
    jsonPointers:
    - /spec/egress
  
