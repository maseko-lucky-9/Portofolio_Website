# ==============================================
# ExternalSecret - Backend API (dev)
# ==============================================
# Added as a full resource, not a patch: the backend ExternalSecret is NOT in
# `base`. It exists only as portfolio-api/k8s/overlays/prod/external-secret.yaml,
# and that overlay's kustomization.yaml has no `resources:` key at all, so the
# file has never actually been rendered by kustomize. Copying prod's overlay
# structure would have inherited that dead file, and the backend Deployment
# would sit in CreateContainerConfigError forever waiting on a Secret nothing
# creates.
#
# EVERY property listed here must exist in Vault at kv/portfolio/dev. External
# Secrets Operator fails the WHOLE ExternalSecret if a single remoteRef.property
# is missing — a partially-populated path yields no Secret at all.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-secrets
  labels:
    app.kubernetes.io/name: backend-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: portfolio
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore

  target:
    name: backend-secrets
    creationPolicy: Owner
    deletionPolicy: Retain

  data:
    - secretKey: database-url
      remoteRef: { key: portfolio/dev, property: database-url }
    - secretKey: redis-url
      remoteRef: { key: portfolio/dev, property: redis-url }
    - secretKey: jwt-secret
      remoteRef: { key: portfolio/dev, property: jwt-secret }
    - secretKey: jwt-access-expiry
      remoteRef: { key: portfolio/dev, property: jwt-access-expiry }
    - secretKey: jwt-refresh-expiry
      remoteRef: { key: portfolio/dev, property: jwt-refresh-expiry }
    - secretKey: github-client-id
      remoteRef: { key: portfolio/dev, property: github-client-id }
    - secretKey: github-client-secret
      remoteRef: { key: portfolio/dev, property: github-client-secret }
    - secretKey: google-client-id
      remoteRef: { key: portfolio/dev, property: google-client-id }
    - secretKey: google-client-secret
      remoteRef: { key: portfolio/dev, property: google-client-secret }
    - secretKey: smtp-user
      remoteRef: { key: portfolio/dev, property: smtp-user }
    - secretKey: smtp-pass
      remoteRef: { key: portfolio/dev, property: smtp-pass }
