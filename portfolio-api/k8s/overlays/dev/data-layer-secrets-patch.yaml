# ==============================================
# ExternalSecret Patches - data layer (dev)
# ==============================================
# CRITICAL. portfolio-api/k8s/base/database/external-secret.yaml and
# base/redis/external-secret.yaml HARDCODE `key: portfolio/live`. Patching only
# the backend ExternalSecret leaves the dev data layer authenticating as the
# `portfolio-dev` Vault role and then requesting the PRODUCTION path. Two
# outcomes, both bad:
#
#   - the dev Vault policy is correctly narrow  -> 403, postgres/redis never
#     start, and the tempting "fix" is to widen the policy;
#   - the dev policy is a wildcard (kv/data/portfolio/*, the obvious copy of
#     prod's role) -> the LIVE Postgres superuser password and live Redis
#     password materialise as plaintext Secrets inside a namespace running
#     LOG_LEVEL=debug, and `deletionPolicy: Retain` means they persist.
#
# spec.data is a plain list on a CRD with no patch merge key, so these strategic
# merge patches replace the list wholesale — which is exactly the intent.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-secrets
spec:
  data:
    - secretKey: username
      remoteRef: { key: portfolio/dev, property: postgres-username }
    - secretKey: password
      remoteRef: { key: portfolio/dev, property: postgres-password }
    - secretKey: postgres-password
      remoteRef: { key: portfolio/dev, property: postgres-root-password }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redis-secrets
spec:
  data:
    - secretKey: password
      remoteRef: { key: portfolio/dev, property: redis-password }
