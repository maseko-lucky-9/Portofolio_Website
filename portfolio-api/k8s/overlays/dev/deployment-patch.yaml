# ==============================================
# Deployment Patch - Development
# ==============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: backend-api
          resources:
            requests:
              memory: "192Mi"
              cpu: "100m"
            limits:
              memory: "384Mi"
              cpu: "400m"
          env:
            - name: LOG_LEVEL
              value: "debug"
            - name: DEMO_MODE
              value: "true"
