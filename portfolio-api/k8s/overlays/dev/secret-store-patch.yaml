# ==============================================
# SecretStore Patch - dev
# ==============================================
# The base SecretStore authenticates to Vault with the Kubernetes auth role
# `portfolio-live`. dev must use its own role so the Vault policy — not just the
# namespace — is what bounds which secrets are reachable.
#
# SecretStore is namespace-scoped (not ClusterSecretStore), which is the right
# call, but namespace scoping only separates the auth IDENTITY. The actual
# authorization boundary is the Vault policy attached to this role. See
# docs/deployment/PROD_FREEZE.md and the split plan for the required policy —
# it must NOT be a kv/data/portfolio/* wildcard.
#
# Also required, and easy to miss: the SecretStore resolves `vault-tls-ca` in
# its OWN namespace. Nothing in this repo creates it in `dev`, so it must be
# copied in once:
#   kubectl -n dev create secret generic vault-tls-ca --from-file=ca.crt=<vault-ca>
# Never "fix" a TLS failure by deleting caProvider — Vault uses a self-signed
# cert and that would drop server verification entirely.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      auth:
        kubernetes:
          role: "portfolio-dev"
