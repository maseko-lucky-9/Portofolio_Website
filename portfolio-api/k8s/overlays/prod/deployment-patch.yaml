# ==============================================
# Deployment Patch - Production
# Resource adjustments for production environment
# ==============================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api
spec:
  # Initial value only — the HPA owns replicas at runtime and ArgoCD ignores
  # /spec/replicas for this app.
  replicas: 1
  template:
    spec:
      containers:
      - name: backend-api
        resources:
          requests:
            memory: "256Mi"
            # 50m, down from 200m: measured usage across all three prod replicas
            # was 1-4m each. 50m still leaves >12x headroom, and keeps HPA
            # utilisation (usage/request) far below the 60% scale-out target.
            cpu: "50m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        env:
        - name: LOG_LEVEL
          value: "warn"
        - name: DEMO_MODE
          value: "false"
