# ==============================================
# Backend CD Pipeline
# Builds Docker image and deploys to production
# ==============================================
# Required secrets:
#   GITHUB_TOKEN              - automatic (packages:write needed)
#   TAILSCALE_OAUTH_CLIENT_ID - Tailscale OAuth client ID (tag:ci must exist)
#   TAILSCALE_OAUTH_SECRET    - Tailscale OAuth secret
#   HOMELAB_SSH_KEY           - SSH private key for svc-ai-agent@homelab
# ==============================================

name: Backend CD

on:
  push:
    branches:
      - main
    paths:
      - 'portfolio-api/**'
      - 'shared/**'
      - '.github/workflows/backend-cd.yml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      skip_migrations:
        description: 'Skip database migrations'
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend
  HOMELAB_HOST: 100.114.75.127
  HOMELAB_USER: svc-ai-agent
  NODE_VERSION: '20.x'

jobs:
  # ==============================================
  # Job 1: Build and Push Docker Image to GHCR
  # ==============================================
  build-image:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
      short-sha: ${{ steps.vars.outputs.short-sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set variables
        id: vars
        run: echo "short-sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./portfolio-api
          file: ./portfolio-api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.short-sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.short-sha }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.spdx.json
          retention-days: 30

  # ==============================================
  # Job 2: Database Migration Plan (Dry Run)
  # ==============================================
  migration-plan:
    name: Database Migration Plan
    runs-on: ubuntu-latest
    needs: build-image
    if: github.event_name != 'workflow_dispatch' || !inputs.skip_migrations

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'portfolio-api/package.json'

      - name: Install dependencies
        working-directory: ./portfolio-api
        run: npm install

      - name: Generate Prisma Client
        working-directory: ./portfolio-api
        run: npm run db:generate

      - name: Check for pending migrations
        id: check-migrations
        working-directory: ./portfolio-api
        run: |
          echo "Checking for pending migrations..."
          if [ -d "prisma/migrations" ]; then
            MIGRATION_COUNT=$(ls -1 prisma/migrations | grep -v migration_lock.toml | wc -l)
            echo "Found $MIGRATION_COUNT migration(s)"
            echo "migration-count=$MIGRATION_COUNT" >> $GITHUB_OUTPUT
          else
            echo "No migrations directory found"
            echo "migration-count=0" >> $GITHUB_OUTPUT
          fi

      - name: Generate migration SQL (dry run)
        if: steps.check-migrations.outputs.migration-count > 0
        working-directory: ./portfolio-api
        run: |
          echo "Dry-run: ${{ steps.check-migrations.outputs.migration-count }} pending migration(s)"
          echo "Actual migrations will be applied during deployment"

  # ==============================================
  # Job 3: Mirror Image & Deploy to Homelab
  #
  # Connects via Tailscale → SSHes into homelab →
  # pulls from GHCR → pushes to localhost:32000 →
  # rolling restart → in-cluster smoke test → cleanup
  # ==============================================
  deploy-homelab:
    name: Deploy to Homelab
    runs-on: ubuntu-latest
    needs: [build-image, migration-plan]
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    environment:
      name: prod
      url: http://api.portfolio.homelab

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci

      - name: Mirror image & deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        with:
          host: ${{ env.HOMELAB_HOST }}
          username: ${{ env.HOMELAB_USER }}
          key: ${{ secrets.HOMELAB_SSH_KEY }}
          envs: GHCR_TOKEN,GITHUB_ACTOR
          command_timeout: 10m
          script: |
            set -euo pipefail

            # 1. Mirror ghcr.io → homelab local registry
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            docker pull ghcr.io/maseko-lucky-9/portofolio_website/backend:latest
            docker tag  ghcr.io/maseko-lucky-9/portofolio_website/backend:latest \
                        localhost:32000/portfolio-backend:latest
            docker push localhost:32000/portfolio-backend:latest
            docker logout ghcr.io

            # 2. Verify ExternalSecrets are synced before rolling out
            kubectl wait --for=condition=SecretSynced externalsecret/prod-backend-secrets \
              -n prod --timeout=60s || echo "Warning: ExternalSecret not synced — proceeding"

            # 3. Rolling update — force pods to pull new image
            kubectl rollout restart deployment/prod-backend-api -n prod
            kubectl rollout status deployment/prod-backend-api -n prod --timeout=5m

            # 4. Smoke test in-cluster (no external DNS dependency)
            sleep 5
            kubectl exec -n prod deployment/prod-backend-api -- \
              curl -sf http://localhost:3000/api/v1/health/live
            kubectl exec -n prod deployment/prod-backend-api -- \
              curl -sf http://localhost:3000/api/v1/health/ready
            echo "Smoke tests passed"

            # 5. Cleanup (hard rule — no dangling images)
            docker image rm ghcr.io/maseko-lucky-9/portofolio_website/backend:latest 2>/dev/null || true
            docker image prune -f

  # ==============================================
  # Job 4: Rollback on Failure
  # ==============================================
  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    needs: deploy-homelab
    if: failure() && needs.deploy-homelab.result == 'failure'

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci

      - name: Rollback deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.HOMELAB_HOST }}
          username: ${{ env.HOMELAB_USER }}
          key: ${{ secrets.HOMELAB_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            kubectl rollout undo deployment/prod-backend-api -n prod
            kubectl rollout status deployment/prod-backend-api -n prod --timeout=5m
            kubectl get pods -n prod -l app=backend-api
            echo "Rollback completed"

  # ==============================================
  # Job 5: CD Summary
  # ==============================================
  cd-summary:
    name: CD Summary
    runs-on: ubuntu-latest
    needs: [build-image, migration-plan, deploy-homelab]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "## Backend CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build & Push | ${{ needs.build-image.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Migration Plan | ${{ needs.migration-plan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy Homelab | ${{ needs.deploy-homelab.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-image.outputs.short-sha }}\`" >> $GITHUB_STEP_SUMMARY
