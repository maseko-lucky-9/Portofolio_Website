name: Lighthouse CI

on:
  pull_request:
    paths:
      - 'portfolio-ui/**'
      - 'lighthouserc.json'
      - '.github/workflows/lighthouse-ci.yml'
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # No `cache: npm` — this repo intentionally commits no lockfile
          # (portfolio-ui/Dockerfile uses `npm install`, not `npm ci`), and
          # setup-node hard-fails when the cache is on with no lockfile to key
          # on. That failure is what skipped this job from May to July 2026.

      - name: Install dependencies
        # `npm install`, not `npm ci` — same reason as the cache above: ci
        # requires a lockfile and this repo commits none.
        run: npm install --include=optional --no-audit --no-fund

      - name: Build UI
        run: npm run build:ui

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.14.x

      - name: Run Lighthouse CI
        run: lhci autorun --config=./lighthouserc.json
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 14
