# ==============================================
# Frontend CI Pipeline
# Runs on pull requests and pushes to main/develop
# ==============================================

name: Frontend CI

on:
  push:
    branches: [main, homelab]
    paths:
      - 'portfolio-ui/**'
      - 'shared/**'
      - '.github/workflows/frontend-ci.yml'
  # NOTE: deliberately NOT path-filtered, unlike the push trigger above.
  # `CI Success` below is a REQUIRED status check on main. When a workflow is
  # skipped by a path filter its checks never report and sit at "Expected —
  # waiting for status", blocking the PR forever. PR #40 (a workflow-only
  # change) hit exactly that: only gitleaks ran.
  #
  # So this must report on every PR, even ones that touch no frontend code.
  # The cost is ~2 min of runner time on off-path PRs; the alternative is a
  # required check that silently blocks unrelated work.
  pull_request:
    branches: [main, homelab]

env:
  NODE_VERSION: '20.x'
  WORKING_DIRECTORY: ./portfolio-ui

jobs:
  # ==============================================
  # Job 1: Code Quality Checks
  # ==============================================
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '**/package.json'

      - name: Install root dependencies
        run: npm install

      - name: Install frontend dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npm install

      - name: Run ESLint
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npm run lint

      # `-b` (build mode) is required, not optional: tsconfig.json is a
      # solution-style config ("files": [] + references), so a bare
      # `tsc --noEmit` compiles ZERO files and exits 0 no matter what is
      # broken. This gate silently checked nothing until 2026-07-26.
      - name: Run TypeScript type check
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npm run typecheck

      # mts/mjs included deliberately: src/lib/kb-patterns.mjs holds the PII rules
      # that gate what the chatbot publishes. Under the previous glob the one
      # safety-critical file in src/ was the only one no formatter or linter saw.
      - name: Check code formatting
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npx prettier --check "src/**/*.{ts,tsx,mts,js,mjs,jsx,json,css}"

      # The "Build & Test" job below never actually ran the suite, so every vitest
      # file in the repo was unenforced. Runs here in `quality` because `build`
      # depends on this job, so a red test now blocks the build.
      - name: Run unit tests
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npm test

  # ==============================================
  # Job 2: Security Scanning
  # ==============================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '**/package.json'

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npm install

      - name: Run npm audit
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=portfolio-ui/package.json

  # ==============================================
  # Job 3: Build and Test
  # ==============================================
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: [quality]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '**/package.json'

      - name: Install root dependencies
        run: npm install

      - name: Install frontend dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npm install

      - name: Build application
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npm run build
        env:
          VITE_API_BASE_URL: https://api.example.com
          VITE_API_VERSION: v1
          VITE_ENABLE_ANALYTICS: true

      - name: Check build output
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          ls -la dist
          du -sh dist

      - name: Assert SEO surfaces carry the canonical domain
        working-directory: ${{ env.WORKING_DIRECTORY }}
        env:
          SITE_HOST: thulanimaseko.co.za
          STALE_HOST: thulanimaseko.com
        run: |
          # sitemap.xml and rss.xml are generated from SITE_ORIGIN in
          # scripts/seo/routes.mjs, which has NO unit-test coverage — nothing
          # else in CI would catch it drifting from the canonical domain.
          # index.html carries the same domain independently (canonical,
          # hreflang, OG, JSON-LD @id) via its own
          # literal strings, not routes.mjs — proven uncovered by reverting
          # just its canonical link and confirming this step still passed.
          # Both directions are checked on every file, so this cannot rot
          # into a vacuous pass: the right host must be PRESENT and the old
          # host ABSENT. grep -F because both hosts contain literal dots.
          fail=0
          for f in dist/index.html dist/sitemap.xml dist/rss.xml dist/robots.txt; do
            if [ ! -f "$f" ]; then
              echo "::error::$f missing — the SEO build step did not run"
              fail=1
              continue
            fi
            if ! grep -qF "$SITE_HOST" "$f"; then
              echo "::error::$f does not reference $SITE_HOST"
              fail=1
            fi
            if grep -qF "$STALE_HOST" "$f"; then
              echo "::error::$f still references $STALE_HOST — incomplete domain rename"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "OK — index.html, sitemap, rss and robots all carry $SITE_HOST"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: portfolio-ui/dist
          retention-days: 7

  # ==============================================
  # Job 4: Bundle Size Analysis
  # ==============================================
  bundle-size:
    name: Bundle Size Analysis
    runs-on: ubuntu-latest
    needs: [build]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '**/package.json'

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: portfolio-ui/dist

      - name: Analyze bundle size
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          echo "📦 Bundle Size Analysis"
          echo "======================="
          find dist -type f -name "*.js" -exec ls -lh {} \; | awk '{print $5, $9}'
          echo ""
          echo "Total bundle size:"
          du -sh dist
          
      - name: Check bundle size limit
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          TOTAL_SIZE=$(du -sm dist | cut -f1)
          MAX_SIZE=10
          if [ $TOTAL_SIZE -gt $MAX_SIZE ]; then
            echo "❌ Bundle size ($TOTAL_SIZE MB) exceeds limit ($MAX_SIZE MB)"
            exit 1
          else
            echo "✅ Bundle size ($TOTAL_SIZE MB) is within limit ($MAX_SIZE MB)"
          fi

  # ==============================================
  # Job 5: Lighthouse CI (Performance)
  # ==============================================
  lighthouse:
    name: Lighthouse Performance
    runs-on: ubuntu-latest
    needs: [build]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: portfolio-ui/dist

      - name: Install http-server
        run: npm install -g http-server

      - name: Serve built application
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          http-server dist -p 8080 -c-1 &
          sleep 5

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            http://localhost:8080
          uploadArtifacts: true
          temporaryPublicStorage: true

  # ==============================================
  # Summary Job
  # ==============================================
  # REQUIRED status check on main. Two rules govern this job; breaking either
  # one silently disables branch protection rather than failing loudly.
  #
  # 1. `if: always()` — NOT `if: success()`. GitHub reports a SKIPPED job as
  #    *successful* to branch protection. With `if: success()`, a failing
  #    `quality` job skips this one, and the required check goes green while
  #    CI is red. That is strictly worse than having no protection at all.
  #
  # 2. The result of every dependency is evaluated explicitly below. `needs:`
  #    alone does not fail this job when `always()` is set — it only orders it.
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [quality, security, build, bundle-size, lighthouse]
    if: always()

    steps:
      - name: Verify all upstream jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Upstream job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::A required CI job did not succeed (results: $RESULTS)"; exit 1 ;;
            esac
          done
          echo "✅ All CI checks passed successfully!"
