# ==============================================
# Frontend CD Pipeline
# Builds Docker image and deploys to production
# ==============================================
# Required secrets:
#   GITHUB_TOKEN              - automatic (packages:write needed)
#   API_BASE_URL              - Vite build arg for backend API URL
#   TAILSCALE_OAUTH_CLIENT_ID - Tailscale OAuth client ID (tag:ci must exist)
#   TAILSCALE_OAUTH_SECRET    - Tailscale OAuth secret
#   HOMELAB_SSH_KEY           - SSH private key for svc-ai-agent@homelab
# ==============================================

name: Frontend CD

on:
  push:
    branches:
      - main
    paths:
      - 'portfolio-ui/**'
      - 'shared/**'
      - '.github/workflows/frontend-cd.yml'
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/frontend
  HOMELAB_HOST: 100.114.75.127
  HOMELAB_USER: svc-ai-agent
  NODE_VERSION: '20.x'

jobs:
  # ==============================================
  # Job 1: Build and Push Docker Image to GHCR
  # ==============================================
  build-image:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./portfolio-ui
          file: ./portfolio-ui/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_BASE_URL=${{ secrets.API_BASE_URL || 'http://api.portfolio.homelab' }}
            VITE_API_VERSION=v1
            VITE_ENABLE_ANALYTICS=true
            VITE_ENABLE_CODE_DEMO=true
            VITE_APP_NAME=Portfolio

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # ==============================================
  # Job 2: Mirror Image & Deploy to Homelab
  #
  # Connects via Tailscale → SSHes into homelab →
  # pulls from GHCR → pushes to localhost:32000 →
  # rolling restart → in-cluster smoke test → cleanup
  # ==============================================
  deploy-homelab:
    name: Deploy to Homelab
    runs-on: ubuntu-latest
    needs: build-image
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    environment:
      name: prod
      url: http://portfolio.homelab

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci

      - name: Mirror image & deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        with:
          host: ${{ env.HOMELAB_HOST }}
          username: ${{ env.HOMELAB_USER }}
          key: ${{ secrets.HOMELAB_SSH_KEY }}
          envs: GHCR_TOKEN,GITHUB_ACTOR
          command_timeout: 10m
          script: |
            set -euo pipefail

            # 1. Mirror ghcr.io → homelab local registry
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            docker pull ghcr.io/maseko-lucky-9/portofolio_website/frontend:latest
            docker tag  ghcr.io/maseko-lucky-9/portofolio_website/frontend:latest \
                        localhost:32000/portfolio-frontend:latest
            docker push localhost:32000/portfolio-frontend:latest
            docker logout ghcr.io

            # 2. Rolling update — force pods to pull new image
            kubectl rollout restart deployment/frontend-prod -n prod
            kubectl rollout status deployment/frontend-prod -n prod --timeout=5m

            # 3. Smoke test in-cluster (no external DNS dependency)
            sleep 5
            kubectl exec -n prod deployment/frontend-prod -- curl -sf http://localhost:8080/health
            kubectl exec -n prod deployment/frontend-prod -- curl -sf -o /dev/null http://localhost:8080/
            echo "Smoke tests passed"

            # 4. Cleanup (hard rule — no dangling images)
            docker image rm ghcr.io/maseko-lucky-9/portofolio_website/frontend:latest 2>/dev/null || true
            docker image prune -f
