# ==============================================
# Homelab CD — dev environment (repo B)
# ==============================================
# Builds the full stack and deploys it to the `dev` namespace on the homelab
# MicroK8s cluster over Tailscale + SSH.
#
# This workflow only runs in the homelab repo. The two repos share git history
# so a promotion is an ordinary PR; the `if:` guard below stops this file from
# ever deploying out of the production repo if it is carried across.
#
# Replaces backend-cd.yml, which was deleted. Three defects were fixed rather
# than inherited:
#   1. it built the API with `context: ./portfolio-api`, but the Dockerfile does
#      `COPY shared/package*.json` and needs the MONOREPO ROOT as context;
#   2. its SSH block hardcoded the production GHCR path, so running it from a
#      differently-named repo would mirror the PROD image and tag it `:dev`;
#   3. it scanned an image tag (`:<short-sha>`) that metadata-action never
#      emitted — that tag only ever existed as `<branch>-<sha>`.
#
# Security posture, carried from cloudflare-cd.yml: no `github.event.*` value is
# referenced in any run:/script: block — every shell command operates on static
# literals or on values passed through `env:`. All third-party actions are
# pinned to a full commit SHA (a tag or branch ref is mutable, and this repo
# holds credentials that reach the homelab).
#
# Required repository secrets — mint NEW ones, do NOT reuse the production
# repo's HOMELAB_SSH_KEY. That key is an unrestricted shell for svc-ai-agent
# with kubectl access to the prod namespace.
#   HOMELAB_DEV_SSH_KEY        - key for a dedicated dev-only user, constrained
#                                in authorized_keys with
#                                restrict,from="100.64.0.0/10"
#                                (no PTY/forwarding, Tailscale-CGNAT source only).
#                                A forced command= is deliberately NOT specified:
#                                sshd substitutes it for EVERY client command,
#                                which would break both the scp upload and the
#                                inline script below. What actually bounds this
#                                key: the dedicated user's kubeconfig is
#                                RoleBound to the dev namespace only, and the
#                                tag:ci-dev Tailscale ACL reaches only this host.
#                                The user DOES need docker access for the mirror
#                                step (a real trade-off — docker group is
#                                root-equivalent on the host). Follow-up that
#                                removes it: pull straight from GHCR in-cluster
#                                (public packages or an imagePullSecret) and
#                                delete the mirror step entirely.
#   TS_DEV_OAUTH_CLIENT_ID     - Tailscale OAuth client tagged tag:ci-dev
#   TS_DEV_OAUTH_SECRET
#   CF_API_TOKEN / CF_ACCOUNT_ID - for the Cloudflare preview upload
# ==============================================

name: Homelab CD (dev)

on:
  push:
    branches: [homelab]
  workflow_dispatch:

concurrency:
  # Two overlapping pushes must never `kubectl apply` the same namespace at once.
  group: homelab-cd
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  HOMELAB_HOST: 100.114.75.127
  HOMELAB_USER: svc-deploy-dev
  NAMESPACE: dev
  KUSTOMIZE_VERSION: v5.5.0

jobs:
  # ==============================================
  # 1. Build both images
  # ==============================================
  build-images:
    name: Build & Push Images
    # Guard: this file must only ever deploy from the homelab repo.
    if: github.repository == 'maseko-lucky-9/portfolio-homelab'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build context is the repo ROOT, with -f pointing at the Dockerfile.
      # portfolio-api/Dockerfile copies `shared/`, which only exists at the root.
      - name: Build & push API image
        uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 # v6.10.0
        with:
          context: .
          file: ./portfolio-api/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/backend:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The UI image builds from portfolio-ui/ and is self-contained (nothing in
      # portfolio-ui/src imports `shared`). VITE_* come from these ARGs — the
      # tracked .env.production that used to supply them was removed, because
      # `vite build` loaded it for EVERY production build and leaked homelab
      # settings into the Cloudflare bundle.
      - name: Build & push UI image
        uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 # v6.10.0
        with:
          context: ./portfolio-ui
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/frontend:dev
          build-args: |
            VITE_API_URL=/api
            VITE_USE_API=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}/backend:dev
          format: sarif
          output: trivy-backend.sarif
          severity: CRITICAL,HIGH

      - name: Upload scan results
        uses: github/codeql-action/upload-sarif@48ab28a6f5dbc2a99bf1e0131198dd8f1df78169 # v3.28.0
        if: always()
        with:
          sarif_file: trivy-backend.sarif

  # ==============================================
  # 2. Render manifests
  # ==============================================
  render:
    name: Render dev manifests
    if: github.repository == 'maseko-lucky-9/portfolio-homelab'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-images
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.render.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Pinned: ArgoCD renders prod with its own bundled kustomize, and an
      # unpinned runner-image bump would silently change this output.
      - name: Install kustomize
        run: |
          curl -sSLo /tmp/k.tar.gz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/k.tar.gz -C /tmp && sudo mv /tmp/kustomize /usr/local/bin/
          kustomize version

      - name: Render bundle
        id: render
        run: |
          {
            kustomize build portfolio-api/k8s/overlays/dev
            echo "---"
            kustomize build portfolio-ui/k8s/overlays/dev
          } > dev-stack.yaml
          test -s dev-stack.yaml || { echo "::error::empty render"; exit 1; }
          # The dev overlays must never emit a resource aimed at another
          # namespace. Anchored ($) so `dev2`/`development` cannot slip through
          # as a substring match.
          if grep -E '^\s+namespace:' dev-stack.yaml | grep -qvE 'namespace: dev$'; then
            echo "::error::rendered bundle references a namespace other than dev"
            grep -E '^\s+namespace:' dev-stack.yaml | grep -vE 'namespace: dev$'
            exit 1
          fi
          # Guard the Vault path: dev must never resolve production secrets.
          if grep -q 'portfolio/live' dev-stack.yaml; then
            echo "::error::rendered bundle reads the PRODUCTION Vault path portfolio/live"
            exit 1
          fi
          echo "digest=$(sha256sum dev-stack.yaml | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "Rendered $(grep -c '^kind:' dev-stack.yaml) resources"

      - name: Upload bundle
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: dev-stack
          path: dev-stack.yaml
          retention-days: 7

  # ==============================================
  # 3. Deploy to the homelab
  # ==============================================
  deploy:
    name: Deploy to homelab dev
    if: github.repository == 'maseko-lucky-9/portfolio-homelab'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: render
    permissions:
      contents: read
      # GHCR packages created by CI default to PRIVATE even in a public repo.
      # The GITHUB_TOKEN handed to the homelab for `docker pull` therefore needs
      # packages:read, or the very first mirror step 401s.
      packages: read
    environment:
      name: dev
      url: https://dev.portfolio.homelab
    steps:
      - name: Download bundle
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: dev-stack

      - name: Connect to Tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_DEV_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_DEV_OAUTH_SECRET }}
          tags: tag:ci-dev

      # Per-run directory under the deploy user's home, not a predictable
      # /tmp/dev-stack.yaml: /tmp is world-writable, so a fixed path lets any
      # local account swap the file between upload and apply and get arbitrary
      # manifests applied with cluster credentials.
      - name: Copy bundle to homelab
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ env.HOMELAB_HOST }}
          username: ${{ env.HOMELAB_USER }}
          key: ${{ secrets.HOMELAB_DEV_SSH_KEY }}
          source: dev-stack.yaml
          target: /home/${{ env.HOMELAB_USER }}/deploy/${{ github.run_id }}-${{ github.run_attempt }}/

      - name: Mirror images, apply, verify
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          SRC_BACKEND: ${{ env.REGISTRY }}/${{ github.repository }}/backend:dev
          SRC_FRONTEND: ${{ env.REGISTRY }}/${{ github.repository }}/frontend:dev
          RUN_DIR: /home/${{ env.HOMELAB_USER }}/deploy/${{ github.run_id }}-${{ github.run_attempt }}
          EXPECTED_DIGEST: ${{ needs.render.outputs.digest }}
          NS: ${{ env.NAMESPACE }}
        with:
          host: ${{ env.HOMELAB_HOST }}
          username: ${{ env.HOMELAB_USER }}
          key: ${{ secrets.HOMELAB_DEV_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,SRC_BACKEND,SRC_FRONTEND,RUN_DIR,EXPECTED_DIGEST,NS
          command_timeout: 15m
          script: |
            set -euo pipefail

            # 1. Integrity — what CI rendered must be what the cluster applies.
            cd "$RUN_DIR"
            echo "${EXPECTED_DIGEST}  dev-stack.yaml" | sha256sum -c -

            # 2. Mirror both images into the in-cluster registry. Source paths
            #    come from ${{ github.repository }}, so this follows the repo
            #    rather than pointing at production.
            #    The token is consumed by `docker login` and immediately unset;
            #    the trap guarantees the stored credential is removed from
            #    ~/.docker/config.json even if a later step aborts the script.
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            unset GHCR_TOKEN
            docker pull "$SRC_BACKEND"
            docker tag  "$SRC_BACKEND"  localhost:32000/portfolio-backend:dev
            docker push localhost:32000/portfolio-backend:dev
            docker pull "$SRC_FRONTEND"
            docker tag  "$SRC_FRONTEND" localhost:32000/portfolio-frontend:dev
            docker push localhost:32000/portfolio-frontend:dev
            docker logout ghcr.io

            # 3. Apply. -n is explicit so a resource missing a namespace field
            #    can never land in `default` or `prod`. The bundle carries its
            #    own Namespace object because `kubectl apply` will not create one.
            kubectl apply --server-side --force-conflicts -n "$NS" -f dev-stack.yaml

            # 4. ExternalSecrets must sync before the workloads can start.
            kubectl wait --for=condition=Ready externalsecret --all -n "$NS" --timeout=120s || {
              echo "::warning::ExternalSecrets not Ready — check the portfolio-dev Vault role and the vault-tls-ca secret in $NS"
              kubectl get externalsecret -n "$NS"
            }

            # 5. Roll out. Postgres first: the API initContainer runs
            #    `prisma migrate deploy` and needs a reachable database.
            kubectl rollout status statefulset/postgres      -n "$NS" --timeout=5m
            kubectl rollout status deployment/redis          -n "$NS" --timeout=3m
            kubectl rollout status deployment/backend-api    -n "$NS" --timeout=5m
            kubectl rollout status deployment/frontend       -n "$NS" --timeout=3m

            # 6. Smoke test. /ready touches the database; /live is a hardcoded
            #    literal and would pass against a completely broken stack.
            #    The API image is node:20-alpine with NO curl (its own
            #    HEALTHCHECK uses `node -e` for the same reason) — an exec'd
            #    curl here fails deterministically after a successful rollout,
            #    and with `set -e` the cleanup below would never run.
            kubectl exec -n "$NS" deployment/backend-api -- \
              node -e "require('http').get('http://localhost:3000/api/v1/health/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
            # Proves the frontend nginx proxy AND the NetworkPolicy path.
            # (curl exists in the frontend image — its Dockerfile installs it.)
            kubectl exec -n "$NS" deployment/frontend -- \
              curl -sf http://localhost:8080/api/v1/health/ready
            echo "smoke tests passed"

            # 7. Clean up.
            cd / && rm -rf "$RUN_DIR"
            docker image rm "$SRC_BACKEND" "$SRC_FRONTEND" 2>/dev/null || true
            docker image prune -f

  # ==============================================
  # 4. Cloudflare preview
  # ==============================================
  # The homelab CANNOT stage the frontend. Production is Cloudflare Workers +
  # src/worker.ts + the full `npm run build` (vite plus six SEO scripts); the
  # homelab pod is nginx + `build:app` (vite only — see portfolio-ui/Dockerfile,
  # which skips the SEO scripts because resvg has no musl binary). /rss.xml,
  # /sitemap.xml, /og/*, the CSP and the security headers are never exercised on
  # the homelab. A preview upload runs the real runtime against the real build,
  # so the thing actually shipped to production gets staged somewhere.
  preview:
    name: Cloudflare preview upload
    if: github.repository == 'maseko-lucky-9/portfolio-homelab'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: npm install --include=optional --no-audit --no-fund
        env:
          HUSKY: '0'

      # Same env as the production deploy: preview must reproduce production,
      # not the homelab. VITE_USE_API stays false — a preview has no backend.
      - name: Build portfolio-ui
        run: npm run build --workspace=portfolio-ui
        env:
          VITE_USE_API: 'false'
          VITE_ENABLE_ANALYTICS: 'false'

      # Same two tripwires as cloudflare-cd.yml — this job builds the identical
      # production bundle, so it must satisfy the identical assertions.
      - name: Assert preview bundle expects no backend
        working-directory: portfolio-ui
        run: |
          if grep -qE 'useApi:[A-Za-z_$][A-Za-z0-9_$]*\("true"' dist/assets/*.js; then
            echo "::error::preview bundle ships useApi=true"; exit 1
          fi
          if ! grep -qE 'useApi:[A-Za-z_$][A-Za-z0-9_$]*\("false"' dist/assets/*.js; then
            echo "::error::expected useApi=(\"false\") shape absent — minifier output changed"; exit 1
          fi
          echo "OK — preview bundle is backend-free"

      # `versions upload` publishes a preview URL WITHOUT promoting it to the
      # live deployment.
      - name: Upload preview version
        uses: cloudflare/wrangler-action@392082e81ffbcb9ebdde27400634aa004b35ea37 # v3.14.0
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: portfolio-ui
          command: versions upload
