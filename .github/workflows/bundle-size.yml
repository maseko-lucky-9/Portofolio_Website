name: Bundle size

on:
  pull_request:
    paths:
      - 'portfolio-ui/src/**'
      - 'portfolio-ui/package.json'
      - 'portfolio-ui/vite.config.ts'
      - '.github/workflows/bundle-size.yml'
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: bundle-size-${{ github.ref }}
  cancel-in-progress: true

jobs:
  size:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          # No `cache: npm` and `npm install` over `npm ci` — both need a
          # lockfile, and this repo intentionally commits none (see
          # portfolio-ui/Dockerfile, which uses npm install for the same
          # reason). setup-node hard-fails with the cache on and no lockfile
          # to key against; that is what killed this job from May 2026.

      - name: Install dependencies
        run: npm install --include=optional --no-audit --no-fund

      - name: Build UI
        run: npm run build --workspace=portfolio-ui

      - name: Check bundle budgets
        run: npm run size --workspace=portfolio-ui

      - name: Upload bundle stats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-stats
          path: portfolio-ui/dist/assets/
          retention-days: 7
