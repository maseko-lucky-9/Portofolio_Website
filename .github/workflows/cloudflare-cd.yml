# ==============================================
# Portfolio CD — Cloudflare Workers
# ==============================================
# Builds portfolio-ui and deploys to the `thulani-portfolio` worker on
# workers.dev via the official wrangler-action.
#
# This workflow REPLACES the previously-removed cloudflare-cd.yml (PR #6).
# Reason for restoring: the Cloudflare Workers Builds Git integration was
# uploading versions on git push but not promoting them to deployments,
# leaving the workers.dev URL serving 404 between merges. A
# GitHub-Actions-driven `wrangler deploy` runs in full deploy mode (upload
# + promote) deterministically on every push to main.
#
# Required repository secrets:
#   CF_API_TOKEN   - Cloudflare API token, scoped: Account -> Workers Scripts -> Edit
#   CF_ACCOUNT_ID  - Cloudflare account ID (1ddc6b389e8661e7a6948805382d1ec4)
#
# Optional repository variables (build-time, not secrets):
#   VITE_API_URL          - frontend -> backend base URL
#   VITE_ENABLE_ANALYTICS - 'true' / 'false'
#
# Security: no untrusted github.event.* inputs are referenced in any run:
# block. All shell commands operate on static literals only.
# ==============================================

name: Portfolio CD (Cloudflare)

on:
  push:
    branches: [main]
    paths:
      - 'portfolio-ui/**'
      - 'shared/**'
      - '.github/workflows/cloudflare-cd.yml'
  workflow_dispatch:

concurrency:
  group: cloudflare-cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build & Deploy
    # This file also exists in the homelab dev repo (the two repos share git
    # history, so every promotion carries it across). Without this guard, a
    # `main` branch appearing in that repo would deploy it to PRODUCTION.
    # homelab-cd.yml carries the mirror-image guard.
    if: github.repository == 'maseko-lucky-9/Portofolio_Website'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies (workspace root)
        run: npm install --include=optional --no-audit --no-fund
        env:
          HUSKY: '0'

      - name: Build portfolio-ui
        run: npm run build --workspace=portfolio-ui
        env:
          # This deploy has NO backend — the API lives on the homelab only.
          # VITE_USE_API must stay 'false' so the data hooks fall back to the
          # static content in src/data and the contact form uses its mailto
          # path instead of POSTing into a 405. See the assertion step below.
          VITE_USE_API: 'false'
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_ENABLE_ANALYTICS: ${{ vars.VITE_ENABLE_ANALYTICS || 'false' }}

      - name: Smoke-check build artefact
        run: |
          test -f portfolio-ui/dist/index.html || (echo "::error::dist/index.html missing" && exit 1)
          du -sh portfolio-ui/dist/assets/*.js | sort -h | tail -5

      - name: Assert bundle expects no backend
        working-directory: portfolio-ui
        run: |
          # A tracked .env.production (homelab-shaped: VITE_USE_API=true,
          # VITE_API_URL=/api) used to leak into this bundle, because `vite build`
          # loads that file on EVERY production build. Result: the contact form
          # POSTed to a static host, got a bare 405, and silently dropped every
          # message. Two tripwires so it cannot come back.
          if [ -f .env.production ]; then
            echo "::error::portfolio-ui/.env.production exists — vite build will load it and override the env: block above"
            exit 1
          fi
          if grep -qE 'useApi:[A-Za-z_$][A-Za-z0-9_$]*\("true"' dist/assets/*.js; then
            echo "::error::built bundle ships useApi=true, but this deploy has no backend"
            exit 1
          fi
          echo "OK — bundle is backend-free"

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: portfolio-ui
          command: deploy

      - name: Smoke-check deployed worker
        env:
          DEPLOYED_URL: https://thulani-portfolio.masekotlg.workers.dev
        run: |
          sleep 5
          status=$(curl -s -o /dev/null -w "%{http_code}" "$DEPLOYED_URL" || echo "000")
          echo "GET $DEPLOYED_URL -> HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::warning::Smoke check returned HTTP $status (may be propagation lag)"
          fi
