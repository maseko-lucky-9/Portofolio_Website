# ==============================================
# Portfolio CD — Cloudflare Workers
# ==============================================
# Builds portfolio-ui and deploys to the `thulani-portfolio` worker on
# workers.dev via the official wrangler-action.
#
# This workflow REPLACES the previously-removed cloudflare-cd.yml (PR #6).
# Reason for restoring: the Cloudflare Workers Builds Git integration was
# uploading versions on git push but not promoting them to deployments,
# leaving the workers.dev URL serving 404 between merges. A
# GitHub-Actions-driven `wrangler deploy` runs in full deploy mode (upload
# + promote) deterministically on every push to main.
#
# Required repository secrets:
#   CF_API_TOKEN   - Cloudflare API token, scoped: Account -> Workers Scripts -> Edit
#   CF_ACCOUNT_ID  - Cloudflare account ID (1ddc6b389e8661e7a6948805382d1ec4)
#
# Optional repository variables (build-time, not secrets):
#   VITE_API_URL          - frontend -> backend base URL
#   VITE_ENABLE_ANALYTICS - 'true' / 'false'
#
# Security: no untrusted github.event.* inputs are referenced in any run:
# block. All shell commands operate on static literals only.
# ==============================================

name: Portfolio CD (Cloudflare)

on:
  push:
    branches: [main]
    paths:
      - 'portfolio-ui/**'
      - 'shared/**'
      - '.github/workflows/cloudflare-cd.yml'
  workflow_dispatch:

concurrency:
  group: cloudflare-cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build & Deploy
    # This file also exists in the homelab dev repo (the two repos share git
    # history, so every promotion carries it across). Without this guard, a
    # `main` branch appearing in that repo would deploy it to PRODUCTION.
    # homelab-cd.yml carries the mirror-image guard.
    if: github.repository == 'maseko-lucky-9/Portofolio_Website'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Must be >= 22: wrangler v4.x hard-exits otherwise ("Wrangler
          # requires at least Node.js v22.0.0"). This bit only when
          # wranglerVersion was pinned below — before that, the action silently
          # resolved an older Node-20-compatible wrangler.
          #
          # Required regardless of the pin: `wrangler deploy` re-runs
          # wrangler.toml's [build] command itself, so the production build
          # executes under whatever Node wrangler runs on.
          #
          # Pinned to 24.19.0 to match every other workflow. This job sat on
          # '22.x' after the rest of the repo moved, and the npm that ships
          # with Node 22 crashes resolving this workspace tree —
          # "Cannot read properties of null (reading 'edgesOut')" — so every
          # deploy since 2026-09-03 failed at the root install while CI, on
          # 24.19.0, stayed green. Keep this in step with the other workflows.
          node-version: '24.19.0'

      - name: Install dependencies (workspace root)
        run: npm install --include=optional --no-audit --no-fund
        env:
          HUSKY: '0'

      - name: Build portfolio-ui
        run: npm run build --workspace=portfolio-ui
        env:
          # This deploy has NO backend — the API lives on the homelab only.
          # VITE_USE_API must stay 'false' so the data hooks fall back to the
          # static content in src/data and the contact form uses its mailto
          # path instead of POSTing into a 405. See the assertion step below.
          VITE_USE_API: 'false'
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_ENABLE_ANALYTICS: ${{ vars.VITE_ENABLE_ANALYTICS || 'false' }}

      - name: Smoke-check build artefact
        run: |
          test -f portfolio-ui/dist/index.html || (echo "::error::dist/index.html missing" && exit 1)
          du -sh portfolio-ui/dist/assets/*.js | sort -h | tail -5

      - name: Assert bundle expects no backend
        working-directory: portfolio-ui
        run: |
          # A tracked .env.production (homelab-shaped: VITE_USE_API=true,
          # VITE_API_URL=/api) used to leak into this bundle, because `vite build`
          # loads that file on EVERY production build. Result: the contact form
          # POSTed to a static host, got a bare 405, and silently dropped every
          # message. Two tripwires so it cannot come back.
          if [ -f .env.production ]; then
            echo "::error::portfolio-ui/.env.production exists — vite build will load it and override the env: block above"
            exit 1
          fi
          if grep -qE 'useApi:[A-Za-z_$][A-Za-z0-9_$]*\("true"' dist/assets/*.js; then
            echo "::error::built bundle ships useApi=true, but this deploy has no backend"
            exit 1
          fi
          # Fail-CLOSED companion: the healthy shape must be PRESENT. Without
          # this, a minifier change that stops emitting the pattern above would
          # silently defeat the tripwire forever and the original silent-405
          # bug could ship under green CI.
          if ! grep -qE 'useApi:[A-Za-z_$][A-Za-z0-9_$]*\("false"' dist/assets/*.js; then
            echo "::error::expected useApi=(\"false\") shape not found in bundle — minifier output changed; update both greps in this step"
            exit 1
          fi
          echo "OK — bundle is backend-free"

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: portfolio-ui
          # Pinned because wrangler.toml now carries [ai] and [[ratelimits]], and
          # wrangler treats UNKNOWN top-level keys as a warning, not an error. An
          # older floating version would therefore deploy green with CHAT_LIMITER
          # undefined, and chat would be dead in production with a passing CI run.
          wranglerVersion: "4.114.0"
          command: deploy
        # CRITICAL: wrangler.toml has a [build] block, and `wrangler deploy`
        # RE-RUNS that build command itself — so the dist/ this workflow built,
        # asserted, and smoke-checked above is thrown away and rebuilt inside
        # this step. Without these env vars, that rebuild had VITE_USE_API
        # undefined and shipped `useApi: void 0` — an unverified artifact —
        # while every assertion upstream passed against the discarded build.
        # The same mechanism is how the tracked .env.production originally
        # leaked useApi=true into production. Keep this env block in lockstep
        # with the "Build portfolio-ui" step above.
        env:
          VITE_USE_API: 'false'
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_ENABLE_ANALYTICS: ${{ vars.VITE_ENABLE_ANALYTICS || 'false' }}

      - name: Smoke-check deployed worker
        env:
          # Custom domain attached 2026-07-31 (see docs/seo/custom-domain-setup.md).
          # Both hosts checked — workers.dev never stops resolving, so it stays
          # the reliable fallback signal if the custom domain ever has DNS/TLS
          # trouble independent of the deploy itself.
          DEPLOYED_URLS: >-
            https://thulani-portfolio.masekotlg.workers.dev
            https://thulanimaseko.co.za
        run: |
          sleep 5
          for url in $DEPLOYED_URLS; do
            status=$(curl -s -o /dev/null -w "%{http_code}" "$url" || echo "000")
            echo "GET $url -> HTTP $status"
            if [ "$status" != "200" ]; then
              echo "::warning::Smoke check for $url returned HTTP $status (may be propagation lag)"
            fi
          done

      - name: Assert LIVE bundle expects no backend
        env:
          DEPLOYED_URLS: >-
            https://thulani-portfolio.masekotlg.workers.dev
            https://thulanimaseko.co.za
        run: |
          # The dist/ assertion above validates a build that `wrangler deploy`
          # then discards and re-runs (see the deploy step's env note). This
          # step closes the loop by asserting what production actually serves
          # — on both hosts, so a route-binding regression on the custom
          # domain can't hide behind workers.dev still passing. Retries cover
          # edge-cache propagation, per host.
          fail=0
          for url in $DEPLOYED_URLS; do
            ok=0
            for attempt in 1 2 3 4 5; do
              html=$(curl -s "$url/__deploy-check-$(date +%s)")
              asset=$(echo "$html" | grep -o '/assets/index-[^"]*\.js' | head -1)
              [ -n "$asset" ] || { echo "$url: no index asset in HTML (attempt $attempt)"; sleep 15; continue; }
              bundle=$(curl -s "$url$asset")
              if echo "$bundle" | grep -qE 'useApi:[A-Za-z_$][A-Za-z0-9_$]*\("false"'; then
                echo "OK — $url live bundle ($asset) ships useApi=false"
                ok=1
                break
              fi
              echo "$url: live bundle not updated yet (attempt $attempt): $(echo "$bundle" | grep -o 'useApi:[^,]*' | head -1)"
              sleep 15
            done
            [ "$ok" -eq 1 ] || { echo "::error::$url never showed useApi=(\"false\") — the deployed artifact is not the verified build"; fail=1; }
          done
          [ "$fail" -eq 0 ] || exit 1
