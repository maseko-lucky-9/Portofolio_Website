# ==============================================
# Nginx Configuration for Portfolio UI SPA
# Non-root, production-optimized
# ==============================================

# No 'user' directive — running as non-root (appuser)
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Security headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Aligned with src/worker.ts (the production CSP) so this container fails
        # on the same things production would. Four deliberate differences:
        #
        #  - 'unsafe-eval' dropped. It was never needed here, and the vendored
        #    field runtime contains no eval/new Function.
        #  - object-src / frame-ancestors / base-uri / form-action / media-src
        #    added — the hardening directives this file was missing.
        #  - t.thulanimaseko.co.za added to script-src and connect-src. Without
        #    it every container page load emits a CSP violation for the Umami
        #    tag in index.html, which is noise that hides real ones.
        #  - upgrade-insecure-requests deliberately NOT copied: this image is
        #    served over plain http on a local port, and upgrading same-origin
        #    subresources to https would 404 every one of them.
        #
        # The homelab API hosts stay in connect-src because this image proxies
        # /api/ to them; production has no backend, so worker.ts omits them.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://t.thulanimaseko.co.za; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://t.thulanimaseko.co.za http://api.portfolio.homelab ws://api.portfolio.homelab; media-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        # ── add_header is REPLACE, not merge ─────────────────────────────────
        # A location block that declares any add_header discards every one
        # inherited from the server block. Both blocks below set Cache-Control,
        # so until this was fixed neither assets NOR index.html carried a single
        # security header — and `/` is served through `location = /index.html`
        # by try_files, so the document response had no CSP at all while the
        # server-level declaration above looked perfectly correct.
        #
        # There is no inherit mechanism, so the headers are repeated. Any new
        # location that sets a header has to repeat them too (see the note in
        # /api/chat, which sets none for exactly this reason).

        # Hashed assets — cache 1 year (immutable)
        location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://t.thulanimaseko.co.za; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://t.thulanimaseko.co.za http://api.portfolio.homelab ws://api.portfolio.homelab; media-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
            access_log off;
        }

        # index.html — never cache (always get fresh version)
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://t.thulanimaseko.co.za; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://t.thulanimaseko.co.za http://api.portfolio.homelab ws://api.portfolio.homelab; media-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        }

        # /api/chat is the ONE API route not served by backend-api: the recruiter
        # chatbot runs on Cloudflare Workers AI, which the homelab cannot host.
        # Exact-match `location =` wins outright over the `/api/` prefix block below,
        # so everything else still reaches backend-api.
        #
        # Proxying server-side (rather than pointing the browser at workers.dev via a
        # VITE_ env var) keeps the page same-origin. That is deliberate: it means the
        # Worker needs no CORS handling, and the Worker's abuse defence depends on
        # never answering a preflight — see src/chat.ts.
        #
        # The upstream is a VARIABLE, not a literal, for the reason documented in the
        # /api/ block below: nginx resolves literal proxy_pass hosts at config-parse
        # time and refuses to start otherwise. With a literal here, a public-DNS blip
        # would CrashLoopBackOff the entire SPA rather than degrade one button.
        # `resolver` + a variable defers resolution to request time.
        location = /api/chat {
            resolver 8.8.8.8 1.1.1.1 valid=30s ipv6=off;
            set $chat_upstream "thulani-portfolio.masekotlg.workers.dev";
            proxy_pass https://$chat_upstream/api/chat;
            proxy_set_header Host $chat_upstream;
            proxy_ssl_server_name on;          # SNI — TLS handshake fails without it
            proxy_http_version 1.1;
            # Required for SSE: without it nginx buffers the whole stream and the
            # answer lands as one blob at EOF. gzip_types above deliberately excludes
            # text/event-stream, so the response is not gzip-buffered either.
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 60s;
            # NOTE: do NOT add any add_header here. add_header is replace-not-merge,
            # so a single one would silently drop all five server-level security
            # headers from this response.
        }

        # Reverse proxy /api requests to the backend service
        # Enables same-origin API calls from the SPA (no CORS needed)
        location /api/ {
            # Upstream is `backend-api` in BOTH environments: the k8s Service
            # (portfolio-api/k8s/base/service.yaml) and the compose service
            # (docker-compose.dev.yml). The old value `backend` matched only
            # compose and never resolved in Kubernetes.
            #
            # STARTUP DEPENDENCY: nginx resolves a literal proxy_pass host at
            # config-parse time and refuses to start if it does not resolve
            # ("host not found in upstream"). The Service object must therefore
            # exist before this pod starts — it does when the stack is applied as
            # one bundle, since a Service gets DNS immediately, even with zero
            # endpoints. Running this image standalone needs a stand-in, e.g.
            # `docker run --add-host backend-api:127.0.0.1 ...`.
            proxy_pass http://backend-api:3000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_connect_timeout 30s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # SPA routing — serve index.html for all unmatched routes
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Block dotfiles
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
