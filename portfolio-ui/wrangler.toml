# Cloudflare Workers Static Assets deploy for the portfolio SPA.
# Per global CLAUDE.md: must use [assets] directive (NOT pages_build_output_dir).
# Build artifact: portfolio-ui/dist/ (Vite output).
#
# Deploy:    npx wrangler deploy
# Local dev: npx wrangler dev
# Preview:   npx wrangler versions deploy
#
# Workers Builds (Cloudflare-native CI):
#   This file is the source of truth. Dashboard build settings should
#   mirror the [build] block below. On wrangler v3.109.0+, drift between
#   dashboard and wrangler.toml triggers an auto-generated PR after build.
#   Build env vars (NODE_VERSION=20, HUSKY=0, VITE_*) are dashboard-only —
#   wrangler.toml [vars] is runtime, not build-time.

name = "thulani-portfolio"
compatibility_date = "2025-04-26"
workers_dev = true

# Custom-domain routes. Zone verified Active 2026-07-31: NS delegation
# confirmed at all three .co.za registry servers (not just a resolver cache),
# apex + www both hold zero DNS records, mail records (SPF/DMARC/null-MX) are
# live — see docs/seo/custom-domain-setup.md for the full exit-gate check.
# `custom_domain = true` auto-provisions DNS records + TLS cert.
[[routes]]
pattern = "thulanimaseko.co.za/*"
zone_name = "thulanimaseko.co.za"
custom_domain = true

[[routes]]
pattern = "www.thulanimaseko.co.za/*"
zone_name = "thulanimaseko.co.za"
custom_domain = true

# Worker entry-point: wraps the ASSETS binding to inject security and
# AI-opt-out response headers (see src/worker.ts). Disable by clearing
# `main` to fall back to pure-static behavior.
main = "src/worker.ts"

# Personal portfolio for Thulani Maseko — deploys to
# `thulani-portfolio.<account>.workers.dev`. No production custom domain
# assigned yet.
#
# The company brand `Prudentia Digital` and its domain prudentiadigital.co.za
# belong to a separate worker (`prudentia-digital-website`, in the
# ~/Repo/apps/prudentia-digital-website repo) and must NOT be claimed
# here. The previous worker name `prudentia-digital-portfolio` (deployed
# from this same wrangler.toml) was misleading — the portfolio is a
# personal surface, not a Prudentia Digital surface. After this rename
# lands, the old worker can be deleted via
# `wrangler delete prudentia-digital-portfolio` or the Cloudflare
# dashboard (Workers & Pages → prudentia-digital-portfolio → Delete).

# WARNING: `wrangler deploy` re-runs this command EVERY time, anywhere —
# including inside CI steps that already built and verified dist/. Whatever
# VITE_* env is present in the shell running `wrangler deploy` is what ships;
# cloudflare-cd.yml therefore sets the same env on its deploy step as on its
# build step, and asserts the LIVE bundle afterwards.
#
# Workers Builds runs this from the wrangler.toml directory (portfolio-ui/).
# `cd ..` ascends to the monorepo root so npm workspaces resolve correctly,
# then builds only the UI workspace (skipping portfolio-api which needs
# DB envs not present in build CI). --include=optional ensures the
# platform-specific @swc/core-linux-x64-gnu binary is installed.
[build]
command = "cd .. && npm install --include=optional --no-audit --no-fund && npm run build:ui"

[assets]
directory = "./dist"
binding = "ASSETS"
# Vite SPA needs all unmatched routes to fall through to index.html
not_found_handling = "single-page-application"
# Force worker (src/worker.ts) to run on every request — including asset
# paths — so it can inject security + AI-opt-out response headers.
# Without this, asset requests bypass the worker entirely and headers
# never reach the response.
run_worker_first = true
# Serve dist/blog/<slug>/index.html at /blog/<slug> (no redirect). Without
# this, default is "auto-trailing-slash" which 307-redirects /blog/<slug>
# -> /blog/<slug>/ — wasting a roundtrip on every crawler hit and
# mismatching our sitemap + canonical URLs (which are slash-less).
html_handling = "drop-trailing-slash"

# Observability is on by default in 2025+ wrangler.
[observability]
enabled = true

# Workers AI — powers POST /api/chat (see src/chat.ts).
#
# COST SAFETY DEPENDS ON THIS ACCOUNT STAYING ON WORKERS FREE. The free tier is a
# hard cap of 10,000 Neurons/day: over it the binding returns error 4006 and stops,
# and on the Free plan it cannot bill. On Workers Paid the same overage bills at
# $0.011/1,000 Neurons with no per-binding ceiling — so if this account is ever
# upgraded for an unrelated reason, revisit the abuse controls in src/chat.ts first.
[ai]
binding = "AI"

# Per-IP throttle so one script cannot burn the day's neuron budget in two minutes.
# No charge beyond normal Workers request cost. Per-colo rather than global, which is
# acceptable because the neuron cap is the real hard stop and it fails closed.
# Note this does NOT defend against a page driving requests from many visitors' IPs —
# the content-type / sec-fetch-site gate in src/chat.ts is what covers that.
[[ratelimits]]
name = "CHAT_LIMITER"
namespace_id = "4201"                 # account-scoped: must not collide with other Workers
simple = { limit = 8, period = 60 }   # period accepts only 10 or 60

# Knowledge-base live sync (see src/kb.ts). GDOC_CV_ID / GDOC_BRIEF_ID are Worker
# secrets, not vars — a link-viewable doc id is a bearer capability for that document.
[[kv_namespaces]]
binding = "KB"
id = "d9e5b519d4ce40cea8a078d24fa7867a"

# Hourly, off the top-of-hour scheduler peak. refreshKb() no-ops safely if the two
# GDOC_*_ID secrets are ever unset.
[triggers]
crons = ["17 * * * *"]
