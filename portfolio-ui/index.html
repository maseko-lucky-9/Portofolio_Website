    <!-- Analytics — self-hosted Umami on the homelab, reached over a Cloudflare
         Tunnel. First-party in the sense that matters: own domain, own server,
         own database, no third-party processor, no cookies, no consent banner.
         (Plausible was removed 2026-07-31 — never registered, so it recorded
         nothing, and Cloud is paid.)

         This is a hand-written FOURTH copy of the tag: index.html is not
         produced by any script. The generated /blog, /answers and /projects
         pages get theirs from analyticsTags() in scripts/seo/routes.mjs.
         domainConsistency.test.ts cross-checks the two.

         `data-domains` makes the tracker no-op anywhere except the live site,
         so dev, preview and Lighthouse runs never pollute the data.

         Both origins below are already permitted by the CSP in src/worker.ts —
         change one without the other and the browser silently refuses to load
         the tracker or to send the beacon.

         No integrity="sha384-..." on the tracker deliberately: this is not a
         third-party CDN but our own Umami instance, and its script.js is
         rewritten by the container's `update-tracker` step on every boot and
         every version bump. A pinned SRI hash would break analytics silently on
         the next upgrade, trading a real availability failure for a threat we
         already control the server for. -->
    <script
      defer
      src="https://t.thulanimaseko.co.za/script.js"
      data-website-id="ed688935-e9e1-4bb3-ac52-b3eb8d09d7c4"
      data-domains="thulanimaseko.co.za,www.thulanimaseko.co.za"
    ></script>
    <script type="module" src="/outbound.js"></script>

    <!-- Fonts are self-hosted via @fontsource (see src/index.css).
         Google Fonts CDN links removed to eliminate third-party round-trip
         and reduce Speed Index / CLS from font-swap jitter. -->

    <!-- LCP image preload — hero profile photo at the mobile breakpoint.
         The <picture> in HeroSection picks AVIF if supported, then WebP, then
         JPEG. Preloading the AVIF at 512w covers the most common viewport;
         desktop hits the 1024w via srcset and skips the preloaded copy. -->
    <link
      rel="preload"
      as="image"
      type="image/avif"
      href="/brand/photo/thulani-512.avif"
      imagesrcset="/brand/photo/thulani-256.avif 256w, /brand/photo/thulani-512.avif 512w, /brand/photo/thulani-1024.avif 1024w"
      imagesizes="(min-width: 1024px) 320px, 240px"
      fetchpriority="high"
    />
