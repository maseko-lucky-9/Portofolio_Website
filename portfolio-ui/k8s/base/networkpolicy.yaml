# ==============================================
# NetworkPolicy - Frontend
# Restrict network access to necessary ports only
# ==============================================

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
  - Ingress
  - Egress
  
  # Ingress rules
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress
    ports:
    - protocol: TCP
      port: 8080
  
  # Egress rules
  egress:
  # Allow DNS resolution (UDP for standard queries, TCP for responses >512 bytes)
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  
  # Allow access to backend API.
  # Label is `app: backend-api` (portfolio-api/k8s/base/deployment.yaml) — the
  # old `app: backend` selector matched nothing, so Calico silently dropped
  # every frontend->API packet. Same class of typo as the nginx proxy_pass;
  # fixing only that one leaves the request failing at the CNI instead.
  - to:
    - podSelector:
        matchLabels:
          app: backend-api
    ports:
    - protocol: TCP
      port: 3000
  
  # Allow HTTPS to external services
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443
