# ==============================================
# ArgoCD App of Apps
# Manages all frontend applications
# ==============================================

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend-apps
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  
  source:
    repoURL: https://github.com/maseko-lucky-9/Portofolio_Website
    targetRevision: HEAD
    path: portfolio-ui/k8s/argocd
  
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  
  # FROZEN — homelab is a dev-only environment; the `prod` namespace no longer
  # receives deploys. Automated sync is OFF deliberately. Do not re-enable
  # without reading the warning below.
  #
  # DANGER: this Application manages `path: portfolio-ui/k8s/argocd`, and
  # `frontend-prod` (application-prod.yaml) carries
  # `resources-finalizer.argocd.argoproj.io`. With `prune: true` here, DELETING
  # OR RENAMING an Application file in that directory made ArgoCD prune the
  # child, whose finalizer then cascade-deleted the live resources — including
  # the prod Postgres PVC. That is a data-loss path triggered by an ordinary
  # git refactor, with nobody typing `kubectl delete`. Pruning is now off.
  syncPolicy: {}
